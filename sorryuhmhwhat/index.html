<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: #000;
  overflow: hidden;
}
#container {
  position: relative;
  width: 100vw;
  height: 100vh;
}
#video {
  position: absolute;
  width: 100%; height: 100%;
  object-fit: cover;
  filter: grayscale(1) contrast(1.15);
  transform: scaleX(-1);
}
#overlay-canvas {
  position: absolute;
  width: 100%; height: 100%;
  object-fit: cover;
  pointer-events: none;
}
#start-screen {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #000;
  cursor: pointer;
}

/* Cycling image titles */
#title-cycle {
  position: relative;
  width: 60vw;
  max-width: 700px;
  min-width: 200px;
  aspect-ratio: 4 / 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

#title-cycle img {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 0;
  transition: opacity 0.08s ease;
  filter: invert(1); /* make images white on black */
}

#title-cycle img.active {
  opacity: 1;
}
</style>
</head>
<body>

<div id="container">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay-canvas"></canvas>
</div>

<div id="start-screen">
  <div id="title-cycle">
    <!-- images injected by JS -->
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>

const BLENDS = [
  'multiply','screen','overlay','hard-light',
  'soft-light','difference','exclusion',
  'color-burn','color-dodge','darken','lighten','luminosity'
];

// Audio
const SOUNDS = ['de.mp3', 'en.mp3', 'fr.mp3'];
const loadedAudios = {};

function preloadAudios() {
  SOUNDS.forEach(src => {
    const audio = new Audio(src);
    audio.preload = 'auto';
    loadedAudios[src] = audio;
  });
}

let currentSound = null;
let activeAudio  = null;

function pickSound() {
  currentSound = SOUNDS[Math.floor(Math.random() * SOUNDS.length)];
}

function playSound() {
  if (!currentSound) return;
  if (activeAudio) { activeAudio.pause(); activeAudio.currentTime = 0; }
  const audio = loadedAudios[currentSound];
  if (!audio) return;
  audio.currentTime = 0;
  audio.play().catch(() => {});
  activeAudio = audio;
}

function stopSound() {
  if (activeAudio) { activeAudio.pause(); activeAudio.currentTime = 0; activeAudio = null; }
}

function isPortrait() { return window.innerHeight > window.innerWidth; }

const STYLES_LAND = ['orditext1.png','orditext2.png','orditext3.png','orditext4.png'];
const STYLES_PORT = ['ipadphonetext1.png','ipadphonetext2.png','ipadphonetext3.png','ipadphonetext4.png'];
const ALL_TITLES  = [...STYLES_LAND, ...STYLES_PORT];

function randomFrom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

let currentBlend = randomFrom(BLENDS);
let currentFile  = null;
let mouthOpen    = false;
let smoothRatio  = 0;
let wasOpen      = false;

const loadedImages = {};

function getFiles() { return isPortrait() ? STYLES_PORT : STYLES_LAND; }

function loadImage(filename) {
  if (loadedImages[filename]) return Promise.resolve(loadedImages[filename]);
  return new Promise(resolve => {
    const img = new Image();
    img.onload  = () => { loadedImages[filename] = img; resolve(img); };
    img.onerror = () => resolve(null);
    img.src = filename;
  });
}

function preloadAll() {
  [...STYLES_LAND, ...STYLES_PORT].forEach(f => loadImage(f));
}

function pickRandom() {
  const files = getFiles();
  currentFile  = randomFrom(files);
  currentBlend = randomFrom(BLENDS);
}

pickRandom();
pickSound();

// ── Start screen cycling animation ──────────────────────────────────────
const titleCycle = document.getElementById('title-cycle');
const titleImgEls = {};

// Create one <img> per title (orditext only)
STYLES_LAND.forEach(filename => {
  const el = document.createElement('img');
  el.src = filename;
  el.alt = '';
  titleImgEls[filename] = el;
  titleCycle.appendChild(el);
});

// Shuffled queue — orditext uniquement, taille aléatoire à chaque affichage
const CYCLE_POOL = ['orditext1.png','orditext2.png','orditext3.png','orditext4.png'];
const SIZE_RANGE = [30, 40, 52, 65, 78, 90]; // vw possibles

function shuffled(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let cycleQueue = [];
let lastTitle   = null;
let activeTitleEl = null;

function nextFromQueue() {
  // Refill quand vide, mais s'assurer que le 1er ne répète pas le dernier affiché
  if (cycleQueue.length === 0) {
    cycleQueue = shuffled(CYCLE_POOL);
    // Si le 1er du nouveau shuffle == le dernier affiché, on le décale à la fin
    if (cycleQueue[0] === lastTitle && cycleQueue.length > 1) {
      cycleQueue.push(cycleQueue.shift());
    }
  }
  return cycleQueue.shift();
}

function showNextTitle() {
  if (activeTitleEl) activeTitleEl.classList.remove('active');
  const filename = nextFromQueue();
  lastTitle = filename;
  activeTitleEl = titleImgEls[filename];
  // taille aléatoire à chaque apparition
  const size = SIZE_RANGE[Math.floor(Math.random() * SIZE_RANGE.length)];
  titleCycle.style.width = size + 'vw';
  activeTitleEl.classList.add('active');
}

showNextTitle();
const cycleInterval = setInterval(showNextTitle, 1000);
// ────────────────────────────────────────────────────────────────────────

const video         = document.getElementById('video');
const overlayCanvas = document.getElementById('overlay-canvas');
const overlayCtx    = overlayCanvas.getContext('2d');
const startScreen   = document.getElementById('start-screen');

function getMouthRatio(lm) {
  const h = Math.abs(lm[13].y - lm[14].y);
  const w = Math.abs(lm[78].x - lm[308].x) || 0.001;
  return h / w;
}

function getFaceBox(lm, W, H) {
  const ring = [10,338,297,332,284,251,389,356,454,323,361,288,
                397,365,379,378,400,377,152,148,176,149,150,136,
                172,58,132,93,234,127,162,21,54,103,67,109];
  let x0=1,x1=0,y0=1,y1=0;
  ring.forEach(i => {
    const p=lm[i]; if(!p) return;
    if(p.x<x0)x0=p.x; if(p.x>x1)x1=p.x;
    if(p.y<y0)y0=p.y; if(p.y>y1)y1=p.y;
  });
  const px=0.06, py=0.09;
  const faceX = (1 - x1) * W;
  return {
    x: Math.max(0, faceX - px*W),
    y: Math.max(0, (y0 - py)*H),
    w: Math.min(W, (x1-x0+px*2)*W),
    h: Math.min(H, (y1-y0+py*2)*H)
  };
}

function onResults(results) {
  const W = video.videoWidth  || 1280;
  const H = video.videoHeight || 720;
  if (overlayCanvas.width  !== W) overlayCanvas.width  = W;
  if (overlayCanvas.height !== H) overlayCanvas.height = H;
  overlayCtx.clearRect(0, 0, W, H);

  if (!results.multiFaceLandmarks?.length) {
    mouthOpen = false; smoothRatio = 0; wasOpen = false; return;
  }

  const lm = results.multiFaceLandmarks[0];
  smoothRatio = smoothRatio * 0.6 + getMouthRatio(lm) * 0.4;

  if (smoothRatio > 0.13) mouthOpen = true;
  if (smoothRatio < 0.09) mouthOpen = false;

  if (mouthOpen && !wasOpen) { pickRandom(); pickSound(); playSound(); }
  if (!mouthOpen && wasOpen) stopSound();
  wasOpen = mouthOpen;

  if (!mouthOpen) return;

  const img = loadedImages[currentFile];
  if (!img) { loadImage(currentFile); return; }

  const box = getFaceBox(lm, W, H);
  if (box.w < 20 || box.h < 20) return;

  overlayCtx.save();
  overlayCtx.globalCompositeOperation = currentBlend;
  overlayCtx.globalAlpha = 0.95;
  overlayCtx.drawImage(img, box.x, box.y, box.w, box.h);
  overlayCtx.restore();
}

async function startCamera() {
  clearInterval(cycleInterval);
  startScreen.style.display = 'none';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = stream;

    const faceMesh = new FaceMesh({
      locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`
    });
    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    faceMesh.onResults(onResults);

    const camera = new Camera(video, {
      onFrame: async () => { await faceMesh.send({ image: video }); },
      width: 1280, height: 720
    });
    camera.start();
    preloadAll();
    preloadAudios();

  } catch (err) {
    startScreen.style.display = 'flex';
  }
}

startScreen.addEventListener('click', startCamera);
window.addEventListener('resize', pickRandom);

</script>
